# Comble un jour manquant precis sur la base PLAT (jvfrvttfedmabnoldbyp).
# Reutilise backfill_resultats_plat_reconstruction.py (filtre PLAT, schema a jour,
# retries integres). N'ecrit jamais dans l'ancienne base.

name: Combler un jour manquant (PLAT)

on:
  workflow_dispatch:
    inputs:
      date_debut:
        description: "Date de debut (YYYY-MM-DD)"
        required: true
        default: "2024-11-07"
      date_fin:
        description: "Date de fin (YYYY-MM-DD)"
        required: true
        default: "2024-11-07"

jobs:
  combler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Combler la periode demandee
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
          DATE_DEBUT: ${{ github.event.inputs.date_debut }}
          DATE_FIN: ${{ github.event.inputs.date_fin }}
          SKIP_INIT_SCHEMA: "true"
        run: python backfill_resultats_plat_reconstruction.py
