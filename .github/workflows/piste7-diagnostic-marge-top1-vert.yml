name: Piste 7 - diagnostic marge #1/#2 (courses VERT, VAL_CALIB uniquement)

on:
  workflow_dispatch:

jobs:
  phase1_split4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 - chargement, variables v3+genealogie, split 70/15/7.5/7.5, checkpoint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python piste6_phase1_split4.py | tee rapport_phase1_diagnostic_marge.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 (piste 7 diagnostic marge, reprend piste6_phase1_split4.py inchange)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1_diagnostic_marge.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le checkpoint (pour le diagnostic)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-piste7-diagnostic-marge-split4
          path: checkpoint_piste6_split4.pkl
          retention-days: 5

  diagnostic_marge_top1_vert:
    needs: phase1_split4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn lightgbm scipy
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-piste7-diagnostic-marge-split4
      - name: Diagnostic marge #1/#2 - courses VERT, VAL_CALIB uniquement (aucun modele, aucune variable, aucune correction)
        run: set -o pipefail; python piste7_diagnostic_marge_top1_vert.py | tee rapport_diagnostic_marge_top1_vert.txt
      - name: Ajouter le rapport au resume du run
        if: always()
        run: |
          echo "# Rapport diagnostic marge #1/#2 (piste 7) - courses VERT, VAL_CALIB uniquement" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_diagnostic_marge_top1_vert.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-diagnostic-marge-top1-vert
          path: rapport_diagnostic_marge_top1_vert.txt
