name: Collecte résultats quotidienne

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 backfill_resultats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
