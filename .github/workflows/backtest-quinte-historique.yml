name: Backtest Quinte historique
on:
  workflow_dispatch:
    inputs:
      date_debut:
        description: Date debut YYYY-MM-DD
        required: true
        default: '2026-08-29'
      date_fin:
        description: Date fin YYYY-MM-DD
        required: true
        default: '2026-09-14'
  push:
    paths:
      - '.github/workflows/backtest-quinte-historique.yml'
      - 'backtest_quinte_historique.py'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn lightgbm requests psycopg2-binary
      - name: Backtest Quinté historique
        env:
          DATE_DEBUT: ${{ inputs.date_debut || '2026-08-29' }}
          DATE_FIN: ${{ inputs.date_fin || '2026-09-14' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
          DATABASE_URL_COTES: ${{ secrets.DATABASE_URL_PLAT }}
        run: python backtest_quinte_historique.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-quinte-historique
          path: |
            backtest_quinte_historique.csv
            backtest_quinte_historique_summary.txt
          if-no-files-found: warn
