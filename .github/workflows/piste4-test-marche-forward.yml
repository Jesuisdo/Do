name: Piste 4 - test marche forward (B+genealogie OOS 29/08 + diagnostic marche)

on:
  workflow_dispatch:
    inputs:
      date_test:
        description: "Date a tester (YYYY-MM-DD), OOS strict avant cette date"
        required: false
        default: "2026-08-29"

jobs:
  test_marche:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn lightgbm
      - name: Entrainer B+genealogie et exporter les scores OOS 29/08 (sans toucher a cotes_historique)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
          DATE_TEST_PISTE4: ${{ github.event.inputs.date_test }}
        run: set -o pipefail; python test_marche_forward_29082026.py | tee rapport_marche_forward.txt
      - name: Ajouter le rapport au resume du run
        if: always()
        run: |
          echo "# Rapport - test marche forward (piste 4)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_marche_forward.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-marche-forward
          path: rapport_marche_forward.txt
      - name: Uploader les scores du modele en artefact (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scores-modele-29082026
          path: scores_modele_*.csv
          if-no-files-found: warn
