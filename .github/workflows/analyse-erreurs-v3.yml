name: Analyse d'erreurs v2 + ameliorations ciblees v3

on:
  workflow_dispatch:

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 - chargement, variables, split, modele v2 + analyse d'erreurs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python entrainer_v3_phase1.py | tee rapport_phase1.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 - chargement + modele v2 + analyse d'erreurs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 1 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase1
          path: rapport_phase1.txt
      - name: Uploader le checkpoint (pour la phase 2)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v3
          path: checkpoint_v3_phase1.pkl
          retention-days: 5

  phase2:
    needs: phase1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-v3
      - name: Phase 2 - modeles v3 (place, gagnant) + comparaison finale
        run: set -o pipefail; python entrainer_v3_phase2.py | tee rapport_phase2.txt
      - name: Ajouter le rapport phase 2 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 2 - modeles v3 + comparaison finale" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase2.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 2 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase2
          path: rapport_phase2.txt
