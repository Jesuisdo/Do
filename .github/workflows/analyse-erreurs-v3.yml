name: Analyse d'erreurs v2 + ameliorations ciblees v3

on:
  workflow_dispatch:

jobs:
  entrainement:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Lancer l'analyse d'erreurs et les ameliorations ciblees
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python entrainer_et_evaluer_v3.py | tee rapport_modele_v3.txt
      - name: Ajouter le rapport au resume du run
        if: always()
        run: |
          echo "# Rapport complet - analyse d'erreurs v2 + ameliorations ciblees v3" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_modele_v3.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-modele-v3
          path: rapport_modele_v3.txt
