name: Collecte des cotes en direct PMU

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python3 collect_live_odds_render.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
