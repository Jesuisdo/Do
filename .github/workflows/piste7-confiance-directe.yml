name: Piste 7 - confiance calculee directement sur B+genealogie (sans etage d'affinage)

on:
  workflow_dispatch:

jobs:
  phase1_split4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 - chargement, variables v3+genealogie, split 70/15/7.5/7.5, checkpoint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python piste6_phase1_split4.py | tee rapport_phase1_piste7.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 (piste 7, reprend piste6_phase1_split4.py inchange) - chargement + split 70/15/7.5/7.5 + checkpoint" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1_piste7.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le checkpoint (pour la phase 2)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-piste7-split4
          path: checkpoint_piste6_split4.pkl
          retention-days: 5

  phase2_confiance_directe:
    needs: phase1_split4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn lightgbm
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-piste7-split4
      - name: Phase 2 - B+genealogie (reutilise) + indicateurs de confiance directs + seuils VALIDATION -> TEST A -> TEST B
        run: set -o pipefail; python piste7_phase2_confiance_directe.py | tee rapport_phase2_piste7.txt
      - name: Ajouter le rapport phase 2 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 2 (piste 7) - confiance directe B+genealogie, sans etage d'affinage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase2_piste7.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 2 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase2-piste7
          path: rapport_phase2_piste7.txt
