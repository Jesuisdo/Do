# Backfill historique MASSIF (plusieurs années) — demandé le 17/08/2026.
#
# Constat : rien ne limite techniquement le backfill dans le temps.
# L'API PMU (offline.turfinfo.api.pmu.fr, la même source non-officielle mais
# documentée par la communauté depuis 2019/2020 que celle déjà utilisée par
# backfill_resultats.py et collect_live_odds_render.py) sert des programmes
# complets — réunions, courses, partants, arrivées, musique, gains — pour
# n'importe quelle date passée, testé et confirmé jusqu'en janvier 2014
# (15/01/2014 répond avec des données réelles ; 15/01/2013 et avant ne
# répondent plus). Si notre base ne contenait que le 21/07 au 16/08/2026,
# ce n'est PAS une limite de la source : c'est simplement qu'aucun backfill
# n'avait encore été lancé plus loin dans le passé.
#
# Historique des runs :
# - Run #2 (17-18/08) : 51 tranches, 21 échecs (19 deadlock schéma, 2
#   timeout 5h). Corrigé par SKIP_INIT_SCHEMA dans backfill_resultats.py.
# - Run #3 (18/08) : retry des 7 premières tranches identifiées : succès.
# - Run #4 : annulé avant exécution (2 tranches à risque de timeout repérées
#   dans les 14 restantes).
# - Run #5 (19/08) : les 14 tranches restantes, dont 2 découpées en
#   sous-tranches de 45 jours pour éviter le timeout. Résultat : 9 succès,
#   1 timeout (2022-08-17→2022-11-14, tranche NON découpée car pas
#   identifiée à risque au départ), 6 échecs par
#   psycopg2.errors.ReadOnlySqlTransaction — la connexion Postgres
#   (Supabase) est passée en lecture seule en cours de route sur plusieurs
#   jobs de plusieurs heures (incident transitoire probable côté
#   infrastructure). Avant correctif, ceci faisait perdre silencieusement
#   toutes les courses restantes du run puis plantait au premier _log().
#   Corrigé le 19/08/2026 dans backfill_resultats.py : détection explicite
#   des erreurs de connexion (au lieu de les traiter comme un échec de
#   course ordinaire), retry du jour en cours jusqu'à 4 fois avec
#   reconnexion complète, et _log() rendu best-effort.
#
# Ce fichier (19/08/2026) est réduit aux 7 tranches encore en échec après
# run #5 (les 9 autres de run #5 ont réussi, inutile de les refaire).
# Aucun autre changement au pipeline. L'insertion reste idempotente (commit
# par course, ON CONFLICT DO NOTHING), donc relancer une tranche déjà
# partiellement remplie ne crée aucun doublon.

name: Backfill historique massif (2014-2026)

on:
  workflow_dispatch: {}

jobs:
  backfill-tranche:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - date_debut: "2022-08-17"
            date_fin: "2022-11-14"
          - date_debut: "2024-11-04"
            date_fin: "2025-02-01"
          - date_debut: "2025-02-02"
            date_fin: "2025-05-02"
          - date_debut: "2025-08-01"
            date_fin: "2025-10-29"
          - date_debut: "2025-10-30"
            date_fin: "2025-12-13"
          - date_debut: "2025-12-14"
            date_fin: "2026-01-27"
          - date_debut: "2026-01-28"
            date_fin: "2026-04-27"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - run: python3 backfill_resultats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE_DEBUT: ${{ matrix.date_debut }}
          DATE_FIN: ${{ matrix.date_fin }}
          SKIP_INIT_SCHEMA: "true"
