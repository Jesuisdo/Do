# Backfill historique MASSIF (plusieurs années) — demandé le 17/08/2026.
#
# Constat : rien ne limite techniquement le backfill dans le temps.
# L'API PMU (offline.turfinfo.api.pmu.fr, la même source non-officielle mais
# documentée par la communauté depuis 2019/2020 que celle déjà utilisée par
# backfill_resultats.py et collect_live_odds_render.py) sert des programmes
# complets — réunions, courses, partants, arrivées, musique, gains — pour
# n'importe quelle date passée, testé et confirmé jusqu'en janvier 2014
# (15/01/2014 répond avec des données réelles ; 15/01/2013 et avant ne
# répondent plus). Si notre base ne contenait que le 21/07 au 16/08/2026,
# ce n'est PAS une limite de la source : c'est simplement qu'aucun backfill
# n'avait encore été lancé plus loin dans le passé.
#
# Ce workflow lance donc un backfill massif de 2014-01-01 à 2026-07-20 (la
# veille du début de notre couverture actuelle), découpé en 51 tranches de
# 90 jours exécutées en jobs PARALLÈLES (matrix), avec un plafond de
# parallélisme volontairement modéré (max-parallel) pour rester correct
# envers les serveurs de PMU malgré le nombre de tranches — chaque tranche
# respecte individuellement le même rythme d'un appel par seconde
# (SLEEP_BETWEEN_CALLS_SEC) que le backfill normal.
#
# Réutilise exactement backfill_resultats.py sans aucune modification : même
# script, même base, mêmes tables, même logique de résilience par course
# (commit individuel, ON CONFLICT DO NOTHING, donc relançable sans risque de
# doublons si une tranche doit être reprise).

name: Backfill historique massif (2014-2026)

on:
  workflow_dispatch: {}

jobs:
  backfill-tranche:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
