# Backfill historique MASSIF (plusieurs années) — demandé le 17/08/2026.
#
# Constat : rien ne limite techniquement le backfill dans le temps.
# L'API PMU (offline.turfinfo.api.pmu.fr, la même source non-officielle mais
# documentée par la communauté depuis 2019/2020 que celle déjà utilisée par
# backfill_resultats.py et collect_live_odds_render.py) sert des programmes
# complets — réunions, courses, partants, arrivées, musique, gains — pour
# n'importe quelle date passée, testé et confirmé jusqu'en janvier 2014
# (15/01/2014 répond avec des données réelles ; 15/01/2013 et avant ne
# répondent plus). Si notre base ne contenait que le 21/07 au 16/08/2026,
# ce n'est PAS une limite de la source : c'est simplement qu'aucun backfill
# n'avait encore été lancé plus loin dans le passé.
#
# Run #2 (17-18/08/2026) a couvert les 51 tranches de 90 jours de la période
# 2014-01-01 → 2026-07-20 en jobs parallèles (matrix, max-parallel: 4). 7 de
# ces 51 tranches ont échoué avec psycopg2.errors.DeadlockDetected : chaque
# instance du script vérifiait/créait le schéma (init_schema -> CREATE TABLE
# IF NOT EXISTS ...) au démarrage, et plusieurs instances exécutant ce DDL en
# même temps sur les mêmes tables se bloquaient mutuellement. Corrigé le
# 18/08/2026 dans backfill_resultats.py par un flag optionnel
# SKIP_INIT_SCHEMA (n'affecte ni la collecte quotidienne ni un backfill
# normal, qui ne définissent jamais cette variable).
#
# Ce fichier a été réduit aux 7 tranches qui ont échoué, pour les relancer
# SEULES sans toucher au run #2 déjà en cours sur les 44 autres tranches
# (le run déjà déclenché utilise une copie figée de ce fichier au moment de
# son déclenchement — le modifier maintenant ne l'affecte pas).
#
# Réutilise exactement backfill_resultats.py (avec le correctif de
# concurrence ci-dessus) sans aucune autre modification : même script, même
# base, mêmes tables, même logique de résilience par course (commit
# individuel, ON CONFLICT DO NOTHING, donc relançable sans risque de
# doublons).

name: Backfill historique massif (2014-2026)

on:
  workflow_dispatch: {}

jobs:
  backfill-tranche:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - date_debut: "2014-12-27"
            date_fin: "2015-03-26"
          - date_debut: "2015-09-23"
            date_fin: "2015-12-21"
          - date_debut: "2016-09-17"
            date_fin: "2016-12-15"
          - date_debut: "2017-03-16"
            date_fin: "2017-06-13"
          - date_debut: "2017-06-14"
            date_fin: "2017-09-11"
          - date_debut: "2017-09-12"
            date_fin: "2017-12-10"
          - date_debut: "2018-06-09"
            date_fin: "2018-09-06"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - run: python3 backfill_resultats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE_DEBUT: ${{ matrix.date_debut }}
          DATE_FIN: ${{ matrix.date_fin }}
          SKIP_INIT_SCHEMA: "true"
