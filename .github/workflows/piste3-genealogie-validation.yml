name: Piste 3 - genealogie point-in-time (validation uniquement)

on:
  workflow_dispatch:

jobs:
  phase1_genealogie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 (piste 3) - chargement, variables v3 + genealogie point-in-time, split, checkpoint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python entrainer_v3_phase1_genealogie.py | tee rapport_phase1_genealogie.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 (piste 3 genealogie) - chargement + checkpoint" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1_genealogie.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 1 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase1-genealogie
          path: rapport_phase1_genealogie.txt
      - name: Uploader le checkpoint (pour la phase 2)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v3-genealogie
          path: checkpoint_v3_phase1_genealogie.pkl
          retention-days: 5

  phase2_genealogie:
    needs: phase1_genealogie
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn lightgbm
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-v3-genealogie
      - name: Phase 2 (piste 3) - v3-gagnant vs B vs B+genealogie, VALIDATION uniquement, double benchmark, analyse d'erreurs 5 axes
        run: set -o pipefail; python entrainer_v3_phase2_genealogie.py | tee rapport_phase2_genealogie.txt
      - name: Ajouter le rapport phase 2 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 2 (piste 3 genealogie) - comparaison VALIDATION, double benchmark, analyse d'erreurs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase2_genealogie.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 2 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase2-genealogie
          path: rapport_phase2_genealogie.txt
