name: Piste 1 - objectif de ranking intra-course (validation uniquement)

on:
  workflow_dispatch:

jobs:
  phase1_ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 (piste 1) - chargement, variables, split, checkpoint enrichi (df_val + groupes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python entrainer_v3_phase1_ranking.py | tee rapport_phase1_ranking.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 (piste 1 ranking) - chargement + checkpoint enrichi" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1_ranking.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 1 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase1-ranking
          path: rapport_phase1_ranking.txt
      - name: Uploader le checkpoint (pour la phase 2)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v3-ranking
          path: checkpoint_v3_phase1_ranking.pkl
          retention-days: 5

  phase2_ranking:
    needs: phase1_ranking
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn lightgbm
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-v3-ranking
      - name: Phase 2 (piste 1) - modele ranking vs v3-gagnant actuel, VALIDATION uniquement, double benchmark
        run: set -o pipefail; python entrainer_v3_phase2_ranking.py | tee rapport_phase2_ranking.txt
      - name: Ajouter le rapport phase 2 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 2 (piste 1 ranking) - comparaison VALIDATION, double benchmark" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase2_ranking.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 2 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase2-ranking
          path: rapport_phase2_ranking.txt
