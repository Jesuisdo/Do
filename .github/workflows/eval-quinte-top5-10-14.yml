name: Evaluation Quinte Top5 10-14
on:
  push:
    paths:
      - 'eval_quinte_top5_10_14.py'
      - '.github/workflows/eval-quinte-top5-10-14.yml'
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Download score artifact
        run: |
          curl -L -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10367112346/zip -o h15.zip
          unzip -o h15.zip
          curl -L -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10365766774/zip -o scores.zip || true
          unzip -o scores.zip || true
          find . -maxdepth 2 -type f -name 'scores_modele_*.csv' -exec cp {} . \; || true
      - run: python eval_quinte_top5_10_14.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-quinte-top5-10-14
          path: |
            eval_quinte_top5_summary.txt
            eval_quinte_top5.csv
