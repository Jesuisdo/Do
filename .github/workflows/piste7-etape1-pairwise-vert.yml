name: Piste 7 - etape 1 - reclassement par paire (courses VERT uniquement)

on:
  workflow_dispatch:

jobs:
  phase1_split4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 - chargement, variables v3+genealogie, split 70/15/7.5/7.5, checkpoint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python piste6_phase1_split4.py | tee rapport_phase1_etape1.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 (piste 7 etape 1, reprend piste6_phase1_split4.py inchange)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1_etape1.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le checkpoint (pour l'etape 1)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-piste7-etape1-split4
          path: checkpoint_piste6_split4.pkl
          retention-days: 5

  etape1_pairwise_vert:
    needs: phase1_split4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn lightgbm
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-piste7-etape1-split4
      - name: Etape 1 - reclassement par paire, courses VERT uniquement, VAL_FIT/VAL_CALIB (aucun TEST A/B)
        run: set -o pipefail; python piste7_etape1_pairwise_vert.py | tee rapport_etape1_pairwise_vert.txt
      - name: Ajouter le rapport etape 1 au resume du run
        if: always()
        run: |
          echo "# Rapport etape 1 (piste 7) - reclassement par paire, courses VERT uniquement" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_etape1_pairwise_vert.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport etape 1 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-etape1-pairwise-vert
          path: rapport_etape1_pairwise_vert.txt
