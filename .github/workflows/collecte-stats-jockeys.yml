# Fichier à créer dans ton dépôt GitHub à l'emplacement EXACT :
#   .github/workflows/collecte-stats-jockeys.yml
#
# Exécute collect_stats_jockeys.py une fois par semaine (ces statistiques
# n'ont pas besoin d'être rafraîchies plus souvent — contrairement aux cotes
# ou aux résultats, un jockey ne change pas de palmarès d'heure en heure).
# Peut aussi être déclenché manuellement à tout moment (workflow_dispatch).

name: Collecte statistiques jockeys/drivers/entraîneurs

on:
  schedule:
    - cron: "0 5 * * 1"   # tous les lundis à 5h UTC
  workflow_dispatch: {}

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python3 collect_stats_jockeys.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
