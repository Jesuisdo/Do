name: Piste 5 - courbe de selection par confiance (validation uniquement)

on:
  workflow_dispatch:

jobs:
  phase1_genealogie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install psycopg2-binary pandas numpy scikit-learn
      - name: Phase 1 (reutilisee a l'identique de piste 3) - chargement, variables v3 + genealogie, split, checkpoint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: set -o pipefail; python entrainer_v3_phase1_genealogie.py | tee rapport_phase1_piste5.txt
      - name: Ajouter le rapport phase 1 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 1 (piste 5, reutilise piste 3) - chargement + checkpoint" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase1_piste5.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le checkpoint (pour la phase 2)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v3-genealogie-piste5
          path: checkpoint_v3_phase1_genealogie.pkl
          retention-days: 5

  phase2_courbe_confiance:
    needs: phase1_genealogie
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install pandas numpy scikit-learn lightgbm
      - name: Telecharger le checkpoint de la phase 1
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-v3-genealogie-piste5
      - name: Phase 2 (piste 5) - entrainement B+genealogie + courbe couverture/confiance
        run: set -o pipefail; python piste5_phase2_courbe_confiance.py | tee rapport_phase2_piste5.txt
      - name: Ajouter le rapport phase 2 au resume du run
        if: always()
        run: |
          echo "# Rapport phase 2 (piste 5) - courbe de selection par confiance" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat rapport_phase2_piste5.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Uploader le rapport phase 2 en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-phase2-piste5
          path: rapport_phase2_piste5.txt
