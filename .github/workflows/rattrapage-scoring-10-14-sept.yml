name: Rattrapage scoring 10-14 septembre

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rattrapage-scoring-10-14-sept.yml'

jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary pandas numpy scikit-learn lightgbm
      - name: Scorer les 5 journees B+genealogie
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PLAT }}
        run: |
          set -e
          mkdir -p scoring_10_14
          for d in 2026-09-10 2026-09-11 2026-09-12 2026-09-13 2026-09-14; do
            echo "===== SCORING $d ====="
            DATE_TEST_PISTE4="$d" python test_marche_forward_29082026.py | tee "scoring_10_14/rapport_${d}.txt"
            if ls scores_modele_*.csv >/dev/null 2>&1; then
              cp scores_modele_*.csv scoring_10_14/ || true
              rm -f scores_modele_*.csv
            fi
          done
      - name: Inventaire des sorties
        run: |
          echo '=== FICHIERS PRODUITS ==='
          ls -lah scoring_10_14
          echo '=== NOMBRE DE LIGNES CSV ==='
          for f in scoring_10_14/*.csv; do [ -e "$f" ] && wc -l "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: scoring-B-genealogie-10-14-sept
          path: scoring_10_14/
          retention-days: 30
